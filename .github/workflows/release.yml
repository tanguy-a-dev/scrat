name: Release

# Releases are cut from main automatically, but only from a commit that has
# already gone green: this runs *after* the CI workflow rather than on push, so
# a red main can never produce a tag.
#
# The order is deliberate — decide the version, build every platform, and only
# then write the version bump back to main and create the tag. Nothing is
# tagged that did not build everywhere first.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump ('auto' reads it from the commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Pushing the version-bump commit, the tag, and the release itself. Nothing
# here needs any other scope.
permissions:
  contents: write

# Never cut two releases at once — the second would race the first's push to
# main. Queue rather than cancel: cancelling mid-way could leave a pushed tag
# with no release attached to it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide version
    runs-on: ubuntu-latest
    # `workflow_run` also fires when CI fails, and for CI runs triggered by
    # pull requests. Both are filtered out here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      bump: ${{ steps.version.outputs.bump }}
      version: ${{ steps.version.outputs.next }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve the commit being released
        id: resolve
        env:
          # For workflow_run, github.sha is the default branch tip, which is not
          # necessarily the commit CI actually passed on.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          # Full history and tags: the bump is derived from the commits written
          # since the last release tag.
          fetch-depth: 0

      - name: Classify the commits since the last release
        id: version
        env:
          FORCED_BUMP: ${{ inputs.bump || 'auto' }}
        # Deliberately not piped into `tee`: the default shell here is `bash -e`
        # without `pipefail`, so a failure on the left of a pipe would be masked
        # and the job would carry on with empty outputs.
        run: |
          ./scripts/next-version.sh --force "$FORCED_BUMP" > version.txt
          cat version.txt
          cat version.txt >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          BUMP: ${{ steps.version.outputs.bump }}
          CURRENT: ${{ steps.version.outputs.current }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$BUMP" = "none" ]; then
            echo "No releasable commits since the last tag — staying on $CURRENT." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Releasing **$TAG** (a \`$BUMP\` bump from $CURRENT)." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.bump != 'none'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # One platform failing should still show whether the others are fine.
      fail-fast: false
      matrix:
        include:
          # A single universal binary rather than separate Intel/Apple Silicon
          # downloads — one .dmg that runs on any Mac, and no dependency on the
          # ageing Intel runner images.
          - name: macOS (universal)
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            bundle_dir: target/universal-apple-darwin/release/bundle
          # Built on 22.04 rather than latest: the .deb and .AppImage link
          # against the build machine's glibc, so building on the oldest
          # supported image is what keeps them usable on older distros.
          - name: Linux (x86_64)
            os: ubuntu-22.04
            rust_targets: ""
            tauri_args: ""
            bundle_dir: target/release/bundle
          - name: Windows (x86_64)
            os: windows-latest
            rust_targets: ""
            tauri_args: ""
            bundle_dir: target/release/bundle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            file

      # rusqlite is built with `bundled-sqlcipher-vendored-openssl`, so OpenSSL
      # is compiled from source here rather than linked from the system. On
      # Windows that build needs NASM to assemble, and Strawberry Perl (not the
      # Perl that ships with Git for Windows) to configure.
      - name: Install NASM for the vendored OpenSSL build
        if: runner.os == 'Windows'
        run: choco install nasm --no-progress --yes

      - name: Point the OpenSSL build at NASM and Strawberry Perl
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"

      # The version is written into the working tree but not committed. It is
      # committed in the release job, only once every platform has built, so a
      # failed build never leaves a version bump behind on main.
      - name: Stamp the version
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: ./scripts/set-version.sh "$VERSION"

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build the app bundles
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.tauri_args }}
        run: npm run tauri -- build $TAURI_ARGS

      - name: Collect the bundles
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        run: |
          mkdir -p dist
          # -print0/-d '' so a path containing spaces survives; macOS bundle
          # directory names contain the product name and can.
          find "$BUNDLE_DIR" -type f \( \
              -name '*.dmg' -o -name '*.app.tar.gz' \
              -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \
              -o -name '*.msi' -o -name '*-setup.exe' \
            \) -print0 | while IFS= read -r -d '' bundle; do
              cp "$bundle" dist/
            done
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::No installers were produced under $BUNDLE_DIR"
            find "$BUNDLE_DIR" -type f -print
            exit 1
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Tag and publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundles-*
          merge-multiple: true

      # Generated before the tag exists, so `git describe` still resolves to the
      # *previous* release and the range is the one being published.
      - name: Write the release notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          ./scripts/release-notes.sh "" "$TAG" > release-notes.md
          cat >> release-notes.md <<'EOF'

          ### Installing

          | Platform | Download |
          | --- | --- |
          | macOS (Intel or Apple Silicon) | `.dmg` |
          | Linux | `.deb` or `.AppImage` |
          | Windows | `.msi` or `-setup.exe` |

          These builds are **not code-signed**. macOS will refuse the first
          launch — right-click the app and choose *Open* to get the "open
          anyway" prompt. Windows SmartScreen will warn for the same reason;
          choose *More info* → *Run anyway*.

          Scrat keeps everything in one local encrypted database and makes no
          network calls, so there is nothing to sign in to and nothing leaves
          your machine.
          EOF
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # The build ran against a snapshot of main. If main moved on since, the
      # artifacts no longer match what the tag would point at, so stop: the CI
      # run for the newer commit will start a release that covers both.
      - name: Check main has not moved
        env:
          PLANNED_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git fetch origin main
          actual=$(git rev-parse origin/main)
          if [ "$actual" != "$PLANNED_SHA" ]; then
            echo "::error::main moved from $PLANNED_SHA to $actual during the build; the newer commit's CI run will release both."
            exit 1
          fi

      - name: Commit the version bump and tag it
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          PLANNED_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git checkout -B main "$PLANNED_SHA"
          ./scripts/set-version.sh "$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock package.json frontend/package.json
          git commit -m "chore(release): $TAG [skip ci]"

          # Annotated, so `git describe --tags` finds it when deciding the next
          # version. Pushes made with GITHUB_TOKEN do not start a new workflow
          # run, so this cannot loop back into another release.
          git tag -a "$TAG" -m "Scrat $TAG"
          git push origin main
          git push origin "$TAG"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "Scrat $TAG" \
            --notes-file release-notes.md \
            dist/*
