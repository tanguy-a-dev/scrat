name: Build and Release

# Manual only, deliberately. tag.yml bumps the version and pushes a tag
# automatically on every green push to main, but building installers for three
# platforms and publishing them as a GitHub release is not something that
# should happen unattended on every commit — this is run by hand, whenever
# someone decides a tagged commit is actually ready to ship.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.0). Defaults to the most recent tag."
        type: string
        required: false

permissions:
  contents: write

# Never build/publish two releases at once — the second would race the
# first's GitHub release creation.
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the tag to build
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')
          fi
          if ! git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag '$tag' does not exist."
            exit 1
          fi
          echo "Building $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # One platform failing should still show whether the others are fine.
      fail-fast: false
      matrix:
        include:
          # Separate Apple Silicon / Intel builds rather than a universal
          # binary — a universal binary embeds both architectures' code in
          # every download, roughly doubling its size for no benefit to any
          # single user, since each machine only ever runs one of them.
          - name: macOS (Apple Silicon)
            os: macos-latest
            slug: macos-arm64
            rust_targets: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
            bundle_dir: target/aarch64-apple-darwin/release/bundle
          - name: macOS (Intel)
            os: macos-latest
            slug: macos-x64
            rust_targets: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
            bundle_dir: target/x86_64-apple-darwin/release/bundle
          # Built on 22.04 rather than latest: the .deb and .AppImage link
          # against the build machine's glibc, so building on the oldest
          # supported image is what keeps them usable on older distros.
          - name: Linux (x86_64)
            os: ubuntu-22.04
            slug: linux-x64
            rust_targets: ""
            tauri_args: ""
            bundle_dir: target/release/bundle
          - name: Windows (x86_64)
            os: windows-latest
            slug: windows-x64
            rust_targets: ""
            tauri_args: ""
            bundle_dir: target/release/bundle
    steps:
      # Checked out at the tag itself, which already carries the bumped
      # version committed by tag.yml — nothing here needs to stamp a version.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.slug }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            file

      # rusqlite is built with `bundled-sqlcipher-vendored-openssl`, so OpenSSL
      # is compiled from source here rather than linked from the system. On
      # Windows that build needs NASM to assemble, and Strawberry Perl (not the
      # Perl that ships with Git for Windows) to configure.
      - name: Install NASM for the vendored OpenSSL build
        if: runner.os == 'Windows'
        run: choco install nasm --no-progress --yes

      - name: Point the OpenSSL build at NASM and Strawberry Perl
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build the app bundles
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.tauri_args }}
        run: npm run tauri -- build $TAURI_ARGS

      - name: Collect the bundles
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        run: |
          mkdir -p dist
          # -print0/-d '' so a path containing spaces survives; macOS bundle
          # directory names contain the product name and can.
          find "$BUNDLE_DIR" -type f \( \
              -name '*.dmg' -o -name '*.app.tar.gz' \
              -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \
              -o -name '*.msi' -o -name '*-setup.exe' \
            \) -print0 | while IFS= read -r -d '' bundle; do
              cp "$bundle" dist/
            done
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::No installers were produced under $BUNDLE_DIR"
            find "$BUNDLE_DIR" -type f -print
            exit 1
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundles-*
          merge-multiple: true

      # Unlike the old single-workflow pipeline, the tag being released already
      # exists by the time this runs (tag.yml pushed it earlier). Plain
      # `git describe` on the tagged commit would resolve to itself, not the
      # previous release, so the previous tag is found from its parent commit
      # instead and the range is built explicitly.
      - name: Write the release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..$TAG"
          else
            range="$TAG"
          fi
          ./scripts/release-notes.sh "$range" "$TAG" > release-notes.md
          cat >> release-notes.md <<'EOF'

          ### Installing

          | Platform | Download |
          | --- | --- |
          | macOS (Apple Silicon) | `.dmg` (`aarch64`) |
          | macOS (Intel) | `.dmg` (`x64`) |
          | Linux | `.deb` or `.AppImage` |
          | Windows | `.msi` or `-setup.exe` |

          These builds are **not code-signed**. macOS will refuse the first
          launch — right-click the app and choose *Open* to get the "open
          anyway" prompt. Windows SmartScreen will warn for the same reason;
          choose *More info* → *Run anyway*.

          Scrat keeps everything in one local encrypted database and makes no
          network calls, so there is nothing to sign in to and nothing leaves
          your machine.
          EOF
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "Scrat $TAG" \
            --notes-file release-notes.md \
            dist/*
