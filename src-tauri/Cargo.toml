[package]
name = "scrat"
# Inherited from the workspace so the version lives in exactly one file.
# src-tauri/tauri.conf.json deliberately has no `version` key either — Tauri
# falls back to this one. See scripts/set-version.sh.
version.workspace = true
description = "A privacy-first, local-only personal finance desktop app."
authors = ["Kaonashi"]
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scrat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scrat-infra-sqlite.workspace = true
scrat-infra-csv.workspace = true
scrat-domain.workspace = true
scrat-application.workspace = true
chrono.workspace = true
tauri-plugin-dialog = "2.7.2"

