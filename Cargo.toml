[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/application",
  "crates/infra-sqlite",
  "crates/infra-csv",
  "src-tauri",
]

[workspace.package]
version = "0.5.0"
edition = "2024"

[workspace.dependencies]
scrat-domain = { path = "crates/domain" }
scrat-application = { path = "crates/application" }
scrat-infra-sqlite = { path = "crates/infra-sqlite" }
scrat-infra-csv = { path = "crates/infra-csv" }

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
